name: Build survey site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build production site
        env:
          VITE_LEAD_API_URL: ${{ vars.VITE_LEAD_API_URL }}
        run: npm run build

      - name: Upload server-ready files
        uses: actions/upload-artifact@v4
        with:
          name: devosoft-survey-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
